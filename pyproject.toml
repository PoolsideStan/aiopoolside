[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiopoolside"
version = "0.1.0"
description = "Asynchronous Python client for Poolside pool controllers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stan Reznik" }]
requires-python = ">=3.14"
keywords = ["poolside", "pool", "home-automation", "aiohttp", "asyncio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.12.0",
    "cryptography>=43.0.0",
    "noiseprotocol>=0.3.1",
]

[project.urls]
Homepage = "https://github.com/PoolsideStan/aiopoolside"
"Source Code" = "https://github.com/PoolsideStan/aiopoolside"
"Bug Reports" = "https://github.com/PoolsideStan/aiopoolside/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-aiohttp>=1.1",
    "pytest-cov>=6.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
